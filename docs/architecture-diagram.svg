<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="780" fill="#0F1420"/>

  <text x="600" y="45" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="bold">HRI Behavioural Analysis Platform — System Architecture</text>
  <text x="600" y="72" text-anchor="middle" fill="#8B95A8" font-size="14">Docker Compose, 3 containers, local-only inference — no data leaves the deployment boundary</text>

  <!-- Docker network boundary -->
  <rect x="50" y="110" width="1100" height="560" rx="12" fill="none" stroke="#2E4057" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="70" y="135" fill="#5B8DEF" font-size="14" font-weight="bold">Docker network: hri_net</text>

  <!-- Frontend container -->
  <rect x="90" y="165" width="280" height="180" rx="10" fill="#16213E" stroke="#5B8DEF" stroke-width="2"/>
  <text x="230" y="195" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">frontend</text>
  <text x="230" y="214" text-anchor="middle" fill="#8B95A8" font-size="12">Next.js 14 · TypeScript</text>
  <rect x="110" y="230" width="240" height="34" rx="6" fill="#0F1420"/>
  <text x="230" y="252" text-anchor="middle" fill="#C9D3E0" font-size="12">Dashboard · Upload · Analysis UI</text>
  <rect x="110" y="272" width="240" height="34" rx="6" fill="#0F1420"/>
  <text x="230" y="294" text-anchor="middle" fill="#C9D3E0" font-size="12">Auth (login / register)</text>
  <text x="230" y="330" text-anchor="middle" fill="#5B8DEF" font-size="12">:3000</text>

  <!-- Backend container -->
  <rect x="460" y="165" width="300" height="330" rx="10" fill="#16213E" stroke="#22C55E" stroke-width="2"/>
  <text x="610" y="195" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">backend</text>
  <text x="610" y="214" text-anchor="middle" fill="#8B95A8" font-size="12">FastAPI · Python 3.11</text>

  <rect x="480" y="230" width="260" height="26" rx="5" fill="#0F1420"/>
  <text x="610" y="248" text-anchor="middle" fill="#C9D3E0" font-size="11">1. Frame Extraction</text>
  <rect x="480" y="262" width="260" height="26" rx="5" fill="#0F1420"/>
  <text x="610" y="280" text-anchor="middle" fill="#C9D3E0" font-size="11">2. Set-of-Mark Annotation</text>
  <rect x="480" y="294" width="260" height="26" rx="5" fill="#0F1420"/>
  <text x="610" y="312" text-anchor="middle" fill="#C9D3E0" font-size="11">3. VLM Inference (via Ollama)</text>
  <rect x="480" y="326" width="260" height="26" rx="5" fill="#0F1420"/>
  <text x="610" y="344" text-anchor="middle" fill="#C9D3E0" font-size="11">4. Output Parsing + Consistency Check</text>
  <rect x="480" y="358" width="260" height="26" rx="5" fill="#0F1420"/>
  <text x="610" y="376" text-anchor="middle" fill="#C9D3E0" font-size="11">5. Profile Generation (scoring_engine.py)</text>

  <text x="610" y="410" text-anchor="middle" fill="#8B95A8" font-size="11">pipeline.py · vlm_service.py</text>
  <text x="610" y="428" text-anchor="middle" fill="#8B95A8" font-size="11">auth_service.py · video_processor.py</text>
  <text x="610" y="465" text-anchor="middle" fill="#22C55E" font-size="12">:8000</text>

  <!-- Ollama container -->
  <rect x="850" y="165" width="260" height="220" rx="10" fill="#16213E" stroke="#F59E0B" stroke-width="2"/>
  <text x="980" y="195" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">ollama</text>
  <text x="980" y="214" text-anchor="middle" fill="#8B95A8" font-size="12">Local VLM inference server</text>
  <rect x="870" y="230" width="220" height="28" rx="5" fill="#0F1420"/>
  <text x="980" y="249" text-anchor="middle" fill="#C9D3E0" font-size="12">qwen2.5vl:7b — retained</text>
  <rect x="870" y="264" width="220" height="28" rx="5" fill="#0F1420"/>
  <text x="980" y="283" text-anchor="middle" fill="#C9D3E0" font-size="12">minicpm-v:latest — retained</text>
  <rect x="870" y="298" width="220" height="28" rx="5" fill="#4A2323"/>
  <text x="980" y="317" text-anchor="middle" fill="#F87171" font-size="11">llava:13b — excluded (anchoring)</text>
  <rect x="870" y="332" width="220" height="28" rx="5" fill="#4A2323"/>
  <text x="980" y="351" text-anchor="middle" fill="#F87171" font-size="11">llama3.2-vision:11b — incompatible</text>
  <text x="980" y="400" text-anchor="middle" fill="#F59E0B" font-size="12">:11434</text>

  <!-- Volumes -->
  <text x="610" y="530" text-anchor="middle" fill="#5B8DEF" font-size="14" font-weight="bold">Named Docker volumes (persistent, gitignored)</text>

  <rect x="150" y="555" width="200" height="60" rx="8" fill="#1A2332" stroke="#4B5563" stroke-width="1.5"/>
  <text x="250" y="580" text-anchor="middle" fill="#FFFFFF" font-size="13">hri_uploads</text>
  <text x="250" y="600" text-anchor="middle" fill="#8B95A8" font-size="11">Video files</text>

  <rect x="500" y="555" width="200" height="60" rx="8" fill="#1A2332" stroke="#4B5563" stroke-width="1.5"/>
  <text x="600" y="580" text-anchor="middle" fill="#FFFFFF" font-size="13">hri_data</text>
  <text x="600" y="600" text-anchor="middle" fill="#8B95A8" font-size="11">SQLite database</text>

  <rect x="850" y="555" width="200" height="60" rx="8" fill="#1A2332" stroke="#4B5563" stroke-width="1.5"/>
  <text x="950" y="580" text-anchor="middle" fill="#FFFFFF" font-size="13">ollama_models</text>
  <text x="950" y="600" text-anchor="middle" fill="#8B95A8" font-size="11">Pulled VLM weights</text>

  <!-- Arrows: frontend -> backend -->
  <line x1="370" y1="255" x2="460" y2="255" stroke="#5B8DEF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="245" text-anchor="middle" fill="#5B8DEF" font-size="10">REST API</text>

  <!-- Arrows: backend -> ollama -->
  <line x1="760" y1="270" x2="850" y2="270" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="260" text-anchor="middle" fill="#F59E0B" font-size="10">HTTP</text>

  <!-- Arrows: backend -> volumes -->
  <line x1="250" y1="345" x2="250" y2="555" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowgrey)"/>
  <line x1="600" y1="495" x2="600" y2="555" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowgrey)"/>
  <line x1="950" y1="385" x2="950" y2="555" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowgrey)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B8DEF"/>
    </marker>
    <marker id="arrowgrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4B5563"/>
    </marker>
  </defs>

  <text x="600" y="700" text-anchor="middle" fill="#8B95A8" font-size="12">No deployment to AWS/cloud — all inference and storage remain within this local Docker Compose boundary (UK GDPR, Art. 25 — data protection by design)</text>
  <text x="600" y="722" text-anchor="middle" fill="#4B5563" font-size="11">docker-compose.yml (CPU) · docker-compose.lab.yml (NVIDIA GPU)</text>
</svg>
