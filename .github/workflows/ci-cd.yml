###############################################################################
# HRI Platform — CI Pipeline
#
# Runs backend and frontend tests, plus an informational (non-blocking)
# dependency vulnerability scan.
#
# NOTE: this project deliberately does NOT deploy to AWS/EKS. All VLM
# inference and data processing runs entirely on local/lab infrastructure via
# Docker Compose (see docker-compose.yml / docker-compose.lab.yml), a design
# decision made on UK GDPR grounds — the dataset contains special-category
# video data of children collected under an approved ethics protocol. See the
# dissertation's Methodology chapter (Scope Evolution) for the full reasoning.
###############################################################################

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend/
          format: table
          severity: CRITICAL,HIGH

      - name: Trivy vulnerability scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend/
          format: table
          severity: CRITICAL,HIGH

      - name: Bandit Python security audit
        run: |
          pip install bandit
          bandit -r backend/app/ -ll -ii || true